name: Mission Flag foundation tests
on:
  pull_request:
  push:
    branches: [main, planning/pr-01-mission-flag-source-of-truth, feat/pr-02-foundation-batch-1]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
