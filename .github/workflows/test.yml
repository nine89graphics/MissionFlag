name: Mission Flag foundation tests
on:
  pull_request:
  push:
    branches: [main, planning/pr-01-mission-flag-source-of-truth, feat/pr-02-foundation-batch-1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: missionflag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply initial schema to disposable database
        run: |
          psql -h localhost -U postgres -d missionflag_test -v ON_ERROR_STOP=1 -f db/migrations/001_initial.sql
          psql -h localhost -U postgres -d missionflag_test -v ON_ERROR_STOP=1 -f db/migrations/002_refund_controls.sql
          psql -h localhost -U postgres -d missionflag_test -v ON_ERROR_STOP=1 -f db/migrations/003_immutable_prices.sql
          test "$(psql -h localhost -U postgres -d missionflag_test -Atc 'select count(*) from catalog_sizes')" = "6"
          test "$(psql -h localhost -U postgres -d missionflag_test -Atc 'select count(*) from catalog_sizes where enabled')" = "0"
          psql -h localhost -U postgres -d missionflag_test -v ON_ERROR_STOP=1 -c 'SELECT * FROM refund_line_adjustments LIMIT 0'
          psql -h localhost -U postgres -d missionflag_test -v ON_ERROR_STOP=1 -f db/test/acceptance.sql
